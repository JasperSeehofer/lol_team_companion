# Companion production stack (M8): app + Caddy (HTTPS) + nightly backup.
#
#   cp deploy/env.production.example .env           # fill it in
#   cp deploy/backup.env.example deploy/backup.env  # object storage + rclone
#   GIT_SHA=$(git rev-parse --short HEAD) COMPANION_TAG=$GIT_SHA docker compose build
#   COMPANION_TAG=<sha> docker compose up -d
#
# Sized for a small VM (2 vCPU, 4 GB RAM). Only Caddy publishes ports; the app
# is reachable only through Caddy, which is what makes TRUST_FORWARDED_FOR safe.
# See docs/RUNBOOK.md.

name: companion

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    image: companion:${COMPANION_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    # Secrets and settings (SESSION_SECRET, ADMIN_EMAILS, RIOT_API_KEY, ...).
    env_file:
      - .env
    # Fixed by the container layout; these win over .env (compose precedence:
    # environment > env_file).
    environment:
      SURREAL_DATA_DIR: /data/db
      BUG_REPORT_INBOX_PATH: /data/inbox/bug-reports.md
      LEPTOS_SITE_ADDR: 0.0.0.0:3020
      LEPTOS_ENV: PROD
      # Empty means unset for config.rs: a stray APP_ENV=dev in .env must not
      # turn a production instance into a dev run.
      APP_ENV: ""
      # The app port is not published; every request comes through Caddy,
      # which overwrites X-Forwarded-For with the real client address.
      TRUST_FORWARDED_FOR: "true"
      # SurrealKV sizes its block cache as (memory limit / 2 - 1 GiB), which
      # is its 16 MiB minimum under the 1.5 GB limit below; give it 256 MiB.
      # (surrealdb-core 3.0.2 kvs/surrealkv/cnf.rs; CI logged 7.3 GB on an
      # unlimited 16 GB runner.)
      SURREAL_SURREALKV_BLOCK_CACHE_CAPACITY: "268435456"
      # The embedded engine can take more than the 5 s default to release
      # SurrealKV after a long run (seen in M8/M9 testing; data is safe
      # either way). 15 s gives a slow close time to finish; drain 10 s +
      # 15 s still fits stop_grace_period (30 s). It cannot help while the
      # log says "database handle(s) still held". docs/RUNBOOK.md section 4.
      SHUTDOWN_DB_SECS: "15"
    volumes:
      - data:/data
    expose:
      - "3020"
    networks:
      - web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # tini forwards SIGTERM; the app drains requests for up to
    # SHUTDOWN_DRAIN_SECS (10) and waits up to SHUTDOWN_DB_SECS (15, set
    # above) for the database to close, inside the grace period. Committed data is safe
    # even on a kill (SurrealKV syncs every commit).
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:3020/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Startup runs migrations and a Data Dragon refresh before listening.
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M
        reservations:
          memory: 256M
    logging: *default-logging

  caddy:
    image: caddy:2.11
    depends_on:
      app:
        # Not service_healthy: Caddy must run while the app restarts so
        # visitors get the "restarting" page instead of a connection error.
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      COMPANION_DOMAIN: ${COMPANION_DOMAIN:?set COMPANION_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 60s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    logging: *default-logging

  backup:
    image: companion-backup:${COMPANION_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    init: true
    # Object storage credentials and the rclone remote (deploy/backup.env.example).
    env_file:
      - deploy/backup.env
    environment:
      COMPOSE_PROJECT: companion
      APP_SERVICE: app
      DATA_SRC: /data
      STAGING_DIR: /staging
      # Daily at 02:30 UTC (03:30/04:30 in Germany). One run stops the app for
      # the copy: expect 10 to 40 s of "restarting" page.
      BACKUP_AT: ${BACKUP_AT:-02:30}
    volumes:
      # Read-only: the backup never opens the database, it copies the files
      # while the app is stopped.
      - data:/data:ro
      - backup_staging:/staging
      # Needed to stop and start the app container around the copy. This is
      # root-equivalent access to the host; see RUNBOOK "Backups" for the
      # host-cron alternative without it.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backup
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    logging: *default-logging

volumes:
  data:
  caddy_data:
  caddy_config:
  backup_staging:

networks:
  web:
  backup:
