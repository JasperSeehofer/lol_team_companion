name: CI
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always
  CARGO_LEPTOS_VERSION: "0.3.11"

jobs:
  check:
    name: Check, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins stable + wasm32 + clippy + rustfmt.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Check SSR target
        run: cargo check --features ssr

      - name: Check WASM/hydrate target
        run: cargo check --features hydrate --target wasm32-unknown-unknown

      - name: Clippy (SSR)
        run: cargo clippy --features ssr -- -D warnings

      - name: Clippy (WASM/hydrate)
        run: cargo clippy --features hydrate --target wasm32-unknown-unknown -- -D warnings

      - name: Unit tests
        run: cargo test --features ssr --lib

  e2e:
    name: e2e smoke (Playwright)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 60
    env:
      RIOT_API_KEY: RGAPI-ci-dummy
      SURREAL_DATA_DIR: /tmp/surreal-data
      BUG_REPORT_INBOX_PATH: /tmp/bug-reports.md
      # The server binary reads its Leptos config from these when it is not
      # started through `cargo leptos`.
      LEPTOS_OUTPUT_NAME: lol_team_companion
      LEPTOS_SITE_ROOT: target/site
      LEPTOS_SITE_PKG_DIR: pkg
      LEPTOS_SITE_ADDR: 127.0.0.1:3020
      LEPTOS_RELOAD_PORT: "3021"
      BASE_URL: http://127.0.0.1:3020
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-leptos (prebuilt)
        run: |
          curl -sSfL -o /tmp/cargo-leptos.tar.gz \
            "https://github.com/leptos-rs/cargo-leptos/releases/download/v${CARGO_LEPTOS_VERSION}/cargo-leptos-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/cargo-leptos.tar.gz -C /tmp
          install -m 0755 /tmp/cargo-leptos-x86_64-unknown-linux-gnu/cargo-leptos "$HOME/.cargo/bin/cargo-leptos"
          cargo leptos --version

      # Debug build: a release build (LTO, opt-level z for WASM) is too slow for CI.
      - name: Build app (debug)
        run: cargo leptos build

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start server
        run: |
          nohup ./target/debug/lol_team_companion > "$RUNNER_TEMP/server.log" 2>&1 &
          ./scripts/wait_for_server.sh 120 "$BASE_URL"

      - name: Playwright smoke + hydration gate
        working-directory: e2e
        run: npx playwright test smoke.spec.ts hydration-no-panic.spec.ts --retries=1

      - name: Server log
        if: always()
        run: tail -n 200 "$RUNNER_TEMP/server.log" || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  style_guardrails:
    name: Style Guardrails (G-01 / G-12 / raw-hex)
    runs-on: ubuntu-latest
    # Plan 17-01 task 12: Wave 0 enforcement. G-01 and raw-hex are HARD
    # gates from day one (Phase 17 brought the codebase into compliance).
    # G-12 is enforced in scope: only files touched by Phase 17 plans
    # (nav.rs, theme_toggle.rs, ornaments.rs, icon.rs) must be clean.
    # Pre-existing form inputs across the codebase use the legacy
    # `focus:outline-none focus:border-accent` pattern; their migration
    # is tracked in the M2 design-system migration and lands in the hub plans (02-04).
    steps:
      - uses: actions/checkout@v4

      - name: G-01 — No Google Fonts CDN
        run: |
          # Self-hosted fonts only; reject any Google Fonts CDN reference
          # in production CSS, Rust source, or HTML. .claude/skills/ are
          # excluded because they are vendored Claude Code skill HTML
          # templates, not production app code.
          if grep -rE "fonts\.googleapis\.com|fonts\.gstatic\.com" \
            --include="*.css" --include="*.rs" --include="*.html" \
            --exclude-dir=target --exclude-dir=node_modules \
            --exclude-dir=.claude .; then
            echo "::error::G-01 violation — Google Fonts CDN reference detected"
            exit 1
          fi

      - name: G-12 — No outline:none without ring replacement (Phase 17 scope)
        run: |
          # Phase 17 in-scope files only. Pre-existing violations in form
          # inputs are tracked in the M2 design-system migration and migrated by hub plans.
          PHASE_17_FILES="src/components/nav.rs src/components/footer.rs src/components/region/ornaments.rs src/components/icon.rs"
          set +e
          HITS=$(grep -nE "outline\s*:\s*none|outline-none" $PHASE_17_FILES 2>/dev/null)
          set -e
          if [ -n "$HITS" ]; then
            echo "$HITS" | while IFS= read -r line; do
              file=$(echo "$line" | cut -d: -f1)
              lineno=$(echo "$line" | cut -d: -f2)
              start=$((lineno > 2 ? lineno - 1 : 1))
              end=$((lineno + 3))
              context=$(sed -n "${start},${end}p" "$file")
              if ! echo "$context" | grep -qE "focus-visible:ring|focus-visible:outline"; then
                echo "::error file=$file,line=$lineno::G-12 violation — outline:none without focus-visible:ring"
                exit 1
              fi
            done
          fi

      - name: Raw-hex in Phase 17 components (excluding theme blocks)
        run: |
          # Theme blocks in input.css are ALLOWED to have raw hex (canonical
          # token source). The Phase 17 ornament components reference
          # var(--color-*) only. Pre-existing components migrate in hub plans.
          PHASE_17_FILES="src/components/nav.rs src/components/footer.rs src/components/region/ornaments.rs src/components/icon.rs src/pages/closed_beta.rs src/pages/admin/invites.rs src/pages/legal/impressum.rs src/pages/legal/datenschutz.rs"
          set +e
          HITS=$(grep -nE "#[0-9a-fA-F]{6}\b|#[0-9a-fA-F]{3}\b" $PHASE_17_FILES 2>/dev/null \
            | grep -v "^[^:]*://" \
            | grep -v ":\s*//")
          set -e
          if [ -n "$HITS" ]; then
            echo "::error::Raw hex found in Phase 17 components — use semantic tokens"
            echo "$HITS"
            exit 1
          fi
