name: CI
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always
  CARGO_LEPTOS_VERSION: "0.3.11"

jobs:
  check:
    name: Check, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins stable + wasm32 + clippy + rustfmt.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Check SSR target
        run: cargo check --features ssr

      - name: Check WASM/hydrate target
        run: cargo check --features hydrate --target wasm32-unknown-unknown

      - name: Clippy (SSR)
        run: cargo clippy --features ssr -- -D warnings

      - name: Clippy (WASM/hydrate)
        run: cargo clippy --features hydrate --target wasm32-unknown-unknown -- -D warnings

      - name: Unit tests
        run: cargo test --features ssr --lib

      - name: DB integration tests
        run: cargo test --features ssr --test integration

  e2e:
    name: e2e smoke (Playwright)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 60
    # The mission summary step below commits its findings to the branch.
    permissions:
      contents: write
    env:
      RIOT_API_KEY: RGAPI-ci-dummy
      SURREAL_DATA_DIR: /tmp/surreal-data
      BUG_REPORT_INBOX_PATH: /tmp/bug-reports.md
      # The server binary reads its Leptos config from these when it is not
      # started through `cargo leptos`.
      LEPTOS_OUTPUT_NAME: lol_team_companion
      LEPTOS_SITE_ROOT: target/site
      LEPTOS_SITE_PKG_DIR: pkg
      LEPTOS_SITE_ADDR: 127.0.0.1:3020
      LEPTOS_RELOAD_PORT: "3021"
      BASE_URL: http://127.0.0.1:3020
      # M1 security config: production mode (no APP_ENV), so the invite gate
      # is on and SESSION_SECRET is required. Plain http on 127.0.0.1, hence
      # COOKIE_SECURE=false. The e2e fixture registers with the bootstrap
      # invite code; ADMIN_EMAILS lets the admin smoke test sign in as admin.
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      COOKIE_SECURE: "false"
      BOOTSTRAP_INVITE_CODE: E2E-INVITE-CODE
      BOOTSTRAP_INVITE_MAX_USES: "100000"
      E2E_INVITE_CODE: E2E-INVITE-CODE
      RATE_LIMIT_MULTIPLIER: "100"
      ADMIN_EMAILS: e2e-admin@test.invalid
      # The server runs in production mode: gallery.spec.ts asserts that
      # /design is a 404 for visitors and non-admins.
      E2E_EXPECT_PRODUCTION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-leptos (prebuilt)
        run: |
          curl -sSfL -o /tmp/cargo-leptos.tar.gz \
            "https://github.com/leptos-rs/cargo-leptos/releases/download/v${CARGO_LEPTOS_VERSION}/cargo-leptos-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/cargo-leptos.tar.gz -C /tmp
          install -m 0755 /tmp/cargo-leptos-x86_64-unknown-linux-gnu/cargo-leptos "$HOME/.cargo/bin/cargo-leptos"
          cargo leptos --version

      # Debug build: a release build (LTO, opt-level z for WASM) is too slow for CI.
      - name: Build app (debug)
        run: cargo leptos build

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      # The guidance spec's returning-user test needs the seed data; with CI
      # set it fails (instead of skipping) when the seed is missing. The seed
      # tool must run before the server opens the database (one process per
      # SurrealKV directory).
      - name: Seed the database
        run: |
          cargo build --features ssr --bin seed
          ./target/debug/seed

      - name: Start server
        run: |
          nohup ./target/debug/lol_team_companion > "$RUNNER_TEMP/server.log" 2>&1 &
          ./scripts/wait_for_server.sh 120 "$BASE_URL"

      - name: Playwright smoke, hydration gate, auth, admin, legal, account, guidance and team invites
        working-directory: e2e
        run: npx playwright test smoke.spec.ts hydration-no-panic.spec.ts auth.spec.ts admin-invites.spec.ts cross-tenant.spec.ts gallery.spec.ts community-public.spec.ts community-gates.spec.ts bug-triage.spec.ts legal.spec.ts account.spec.ts guidance.spec.ts team-invites.spec.ts password.spec.ts frames-m141.spec.ts match-detail.spec.ts sortable-tables.spec.ts post-game-fill.spec.ts champion-pool-moves.spec.ts enter-submits.spec.ts bug-report.spec.ts feedback-attachment.spec.ts match-day-phone.spec.ts frames-m148.spec.ts login-next.spec.ts save-failure.spec.ts --retries=1 --reporter=list,json,github
        env:
          M141_SHOTS_DIR: ${{ runner.temp }}/m141-frames
          # Any mission's frame specs: PNGs at the top level or in after/ are
          # committed as frames/after, PNGs in before/ as frames/before.
          MISSION_FRAMES_DIR: ${{ runner.temp }}/mission-frames
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-results.json

      # M11: every server-rendered page must finish streaming. leptos
      # 0.8.17 left about one page in 8,000 pending forever under parallel
      # load (the old "page.goto stall"); the check runs 12,000 requests.
      - name: SSR load check (every page finishes streaming)
        # Also after a failed spec: the server is still up, and a stall is
        # worth knowing in the same run.
        if: always()
        run: python3 scripts/ssr_stress.py "$BASE_URL" 12000 16 20

      # server::inflight logs any request without a complete response after
      # 15 s. One the server never finished (not a client that stopped
      # reading) fails the job, with the steps it reached.
      - name: No stalled requests in the server log
        if: always()
        run: |
          # The log must hold the app's own lines, or the check below would
          # pass on an empty or redirected log.
          grep -aq 'Listening on' "$RUNNER_TEMP/server.log" || { echo "::error::the server log has no app lines"; exit 1; }
          if grep -a 'slow request .*no complete response' "$RUNNER_TEMP/server.log" | grep -v 'the client is not reading'; then
            echo "::error::requests that the server never completed (server::inflight lines above)"
            exit 1
          fi

      - name: Server log
        if: always()
        run: tail -n 200 "$RUNNER_TEMP/server.log" || true

      - name: Upload mission frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-frames
          path: |
            ${{ runner.temp }}/m141-frames/
            ${{ runner.temp }}/mission-frames/
          if-no-files-found: ignore
          retention-days: 14

      # Mission branches: no one can read the job logs from the mission
      # host, so the failures, the server's error lines and the frames are
      # committed to the branch (mission/<name> -> .planning/missions/<name>).
      # Only on a push to that branch; a push by GITHUB_TOKEN starts no new run.
      - name: Commit the e2e summary and frames (mission branches)
        if: always() && github.event_name == 'push' && startsWith(github.ref_name, 'mission/')
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          MISSION_DIR=".planning/missions/${BRANCH#mission/}"
          case "${BRANCH#mission/}" in
            ''|*/*|.*) echo "::error::unexpected mission branch name: $BRANCH"; exit 1 ;;
          esac
          python3 scripts/ci_e2e_summary.py "$RUNNER_TEMP/playwright-results.json" \
            "$RUNNER_TEMP/server.log" "${{ github.run_id }}" "${{ github.sha }}" > "$RUNNER_TEMP/ci-e2e-summary.md"
          git fetch --depth=1 origin "$BRANCH"
          git checkout -f -B ci-summary FETCH_HEAD
          FRAMES="$MISSION_DIR/publish-round-r1/frames"
          mkdir -p "$MISSION_DIR"
          cp "$RUNNER_TEMP/ci-e2e-summary.md" "$MISSION_DIR/ci-e2e-summary.md"
          # $MISSION_FRAMES_DIR top level and after/ go to frames/after,
          # $MISSION_FRAMES_DIR/before to frames/before. $M141_SHOTS_DIR
          # (frames-m141.spec.ts, kept as a smoke test) only on mission/M141*
          # branches: its surface names collide with other missions' frames.
          copy_pngs() {
            if ls "$1"/*.png >/dev/null 2>&1; then
              mkdir -p "$2"
              cp "$1"/*.png "$2/"
            fi
          }
          case "$BRANCH" in
            mission/M141*) copy_pngs "$RUNNER_TEMP/m141-frames" "$FRAMES/after" ;;
          esac
          copy_pngs "$RUNNER_TEMP/mission-frames" "$FRAMES/after"
          copy_pngs "$RUNNER_TEMP/mission-frames/after" "$FRAMES/after"
          copy_pngs "$RUNNER_TEMP/mission-frames/before" "$FRAMES/before"
          git add "$MISSION_DIR"
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git -c user.name=ci -c user.email=ci@local commit -q -m "chore(ci): e2e summary and frames for run ${{ github.run_id }} (${{ github.sha }})"
          git push origin "HEAD:$BRANCH"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  scripts:
    name: Ops scripts (shellcheck, backup and restore harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck, rclone, zstd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck rclone zstd

      - name: ShellCheck
        run: shellcheck scripts/*.sh scripts/tests/*.sh deploy/backup/entrypoint.sh

      # backup.sh and restore.sh against a fake docker CLI, a local rclone
      # crypt remote and a mock HTTP app (scripts/tests/mock_app.py).
      - name: Backup and restore harness
        run: ./scripts/tests/run-script-tests.sh scripts

  image:
    name: Container image (build, run, sign in, stop)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_URL: http://127.0.0.1:3020
      E2E_INVITE_CODE: E2E-INVITE-CODE
      E2E_EXPECT_PRODUCTION: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose.yaml and the Caddyfile
        run: |
          cp deploy/env.production.example .env
          cp deploy/backup.env.example deploy/backup.env
          docker compose config -q
          rm .env deploy/backup.env
          docker run --rm -e COMPANION_DOMAIN=ci.example.org -e ACME_EMAIL=ci@example.org \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - uses: docker/setup-buildx-action@v3
        id: buildx

      # BuildKit cache mounts (cargo registry, target/, cargo-leptos tools)
      # are not part of the layer cache; carry them between runs through the
      # Actions cache.
      - uses: actions/cache@v4
        id: mounts
        with:
          path: buildkit-mounts
          key: image-mounts-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Dockerfile') }}-${{ github.run_id }}
          restore-keys: |
            image-mounts-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Dockerfile') }}-
            image-mounts-

      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: buildkit-mounts
          dockerfile: Dockerfile

      - name: Build the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: companion:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=companion-image
          cache-to: type=gha,mode=max,scope=companion-image

      - name: Build the backup sidecar image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backup/Dockerfile
          load: true
          tags: companion-backup:ci
          cache-from: type=gha,scope=companion-backup
          cache-to: type=gha,mode=max,scope=companion-backup

      - name: Inspect the image
        run: |
          docker image ls companion:ci
          docker run --rm --entrypoint sh companion:ci -c \
            'id; ls -la /app /app/site /app/site/pkg; ls /app/site/fonts | head; if ldd /app/lol_team_companion | grep "not found"; then exit 1; fi'
          {
            echo "### Container image"
            echo ""
            echo "| Image | Size |"
            echo "|---|---|"
            echo "| companion:ci | $(docker image inspect companion:ci --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1000000}') |"
            echo "| companion-backup:ci | $(docker image inspect companion-backup:ci --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1000000}') |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The compose settings: read-only root, no capabilities, an anonymous
      # volume for /data (owned by uid 10001 from the image), production mode.
      - name: Run the image
        run: |
          docker run -d --name companion --read-only --tmpfs /tmp:size=64m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -p 127.0.0.1:3020:3020 \
            -e SESSION_SECRET=ci-only-session-secret-0123456789abcdef \
            -e COOKIE_SECURE=false \
            -e BOOTSTRAP_INVITE_CODE=E2E-INVITE-CODE -e BOOTSTRAP_INVITE_MAX_USES=100000 \
            -e RATE_LIMIT_MULTIPLIER=100 -e ADMIN_EMAILS=e2e-admin@test.invalid \
            -e RIOT_API_KEY=RGAPI-ci-dummy \
            companion:ci
          ./scripts/wait_for_server.sh 180 "$BASE_URL" || { docker logs companion; exit 1; }
          docker logs companion 2>&1 | grep -E "security configuration|Listening" || true

      - name: Sign in over HTTP (bootstrap invite)
        run: SMOKE_EMAIL=ci-smoke@test.invalid SMOKE_PASSWORD=ci-smoke-password-123 ./scripts/smoke_signin.sh "$BASE_URL"

      - name: Docker health check turns healthy
        run: |
          for _ in $(seq 1 30); do
            s="$(docker inspect -f '{{.State.Health.Status}}' companion)"
            echo "health: $s"
            [ "$s" = healthy ] && exit 0
            sleep 5
          done
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      # The release build (opt-level z WASM, LTO) must hydrate like the debug build.
      - name: Playwright against the image
        working-directory: e2e
        run: npx playwright test smoke.spec.ts hydration-no-panic.spec.ts auth.spec.ts legal.spec.ts account.spec.ts --retries=1

      - name: Graceful stop, restart on the same volume
        run: |
          start=$(date +%s)
          docker stop -t 30 companion
          echo "stopped in $(( $(date +%s) - start ))s"
          code="$(docker inspect -f '{{.State.ExitCode}}' companion)"
          docker logs companion 2>&1 | tail -n 8
          [ "$code" = 0 ] || { echo "exit code $code (expected 0)"; exit 1; }
          docker logs companion 2>&1 | grep -q "database closed" || { echo "no clean database close in the log"; exit 1; }
          docker start companion
          ./scripts/wait_for_server.sh 180 "$BASE_URL" || { docker logs companion; exit 1; }
          SKIP_REGISTER=1 SMOKE_EMAIL=ci-smoke@test.invalid SMOKE_PASSWORD=ci-smoke-password-123 ./scripts/smoke_signin.sh "$BASE_URL"

      - name: Container log
        if: always()
        run: docker logs companion 2>&1 | tail -n 200 || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-image
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  style_guardrails:
    name: Style guardrails (G-01, design lint)
    runs-on: ubuntu-latest
    # G-01 (no font CDN) is a hard gate. scripts/lint_design.sh enforces the
    # design-system rules (docs/DESIGN.md section 9) over all of src/: every
    # rule is hard zero, and a grep error fails the job too.
    steps:
      - uses: actions/checkout@v4

      - name: G-01 — No Google Fonts CDN
        run: |
          # Self-hosted fonts only; reject any Google Fonts CDN reference
          # in production CSS, Rust source, or HTML. .claude/skills/ are
          # excluded because they are vendored Claude Code skill HTML
          # templates, not production app code.
          if grep -rE "fonts\.googleapis\.com|fonts\.gstatic\.com" \
            --include="*.css" --include="*.rs" --include="*.html" \
            --exclude-dir=target --exclude-dir=node_modules \
            --exclude-dir=.claude .; then
            echo "::error::G-01 violation — Google Fonts CDN reference detected"
            exit 1
          fi

      - name: Design lint (palette, sub-12px text, radius, blur, gradients, ornaments, emoji, theme branching, G-12, hex)
        run: ./scripts/lint_design.sh
